<div class="overlay">
  <div class="modal-box">

    <button class="close-btn" (click)="closeModal.emit()">×</button>

    <h2>Mock Payment</h2>
    <p class="amount">Amount: <strong>₹{{ amount }}</strong></p>

    <div class="card-box">
      <input placeholder="Card Number" maxlength="16">
      <div class="row">
        <input placeholder="MM/YY" maxlength="5">
        <input placeholder="CVV" maxlength="3" type="password">
      </div>
      <input placeholder="Card Holder Name">
    </div>

    <button class="pay-btn" (click)="payNow()" [disabled]="isProcessing">
      {{ isProcessing ? 'Processing...' : 'Pay Now' }}
    </button>

    <div *ngIf="isProcessing" class="loader"></div>

  </div>
</div>
